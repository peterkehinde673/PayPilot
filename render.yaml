services:
  - type: web
    name: paypilot
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_RETURN_URL
        sync: false
      - key: PAYPAL_CANCEL_URL
        sync: false
      - key: PAYPILOT_WEB_ORIGIN
        sync: false
      - key: PAYPILOT_MAX_AUTO_PURCHASE
        value: "500.00"
      - key: PAYPILOT_POLICY_CURRENCY
        value: USD
      - key: AI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: paypilot-db
          property: connectionString

databases:
  - name: paypilot-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
